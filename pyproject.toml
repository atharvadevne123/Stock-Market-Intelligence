[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-market-intelligence-py"
version = "1.0.0"
description = "Stock market data analysis and intelligence platform"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "atharvadevne123", email = "devneatharva@gmail.com"}]
keywords = ["stock", "market", "sentiment", "finbert", "fastapi", "ml"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[tool.setuptools.packages.find]
where = ["."]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short -p no:warnings"
asyncio_mode = "auto"

[tool.mypy]
ignore_missing_imports = true
no_error_summary = true
python_version = "3.11"
strict = false
warn_return_any = true
warn_unused_ignores = true

[tool.coverage.run]
source = ["analysis", "api", "database", "scraper", "nlp"]
omit = ["tests/*", "*/migrations/*", "*/__pycache__/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    '^\s*\.\.\.$',
]
