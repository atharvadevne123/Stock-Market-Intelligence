[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-market-intelligence-py"
version = "1.0.0"
description = "Stock market data analysis and intelligence platform"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "atharvadevne123", email = "devneatharva@gmail.com"}]
keywords = ["stock", "market", "sentiment", "finbert", "fastapi", "ml"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[tool.setuptools.packages.find]
where = ["."]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008", "SIM117"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "B011"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short -p no:warnings"
asyncio_mode = "auto"
markers = [
    "slow: marks tests as slow (deselect with -m 'not slow')",
    "integration: marks tests as integration tests",
    "unit: marks fast unit tests",
    "api: marks API endpoint tests",
    "db: marks database-level tests",
]

[tool.mypy]
ignore_missing_imports = true
no_error_summary = true
python_version = "3.11"
strict = false
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = false
check_untyped_defs = true

[tool.coverage.run]
source = ["analysis", "api", "cache", "database", "scraper", "nlp", "scheduler", "utils"]
omit = ["tests/*", "*/migrations/*", "*/__pycache__/*", "scripts/*"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 60
exclude_lines = [
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    '^\s*\.\.\.$',
    "if TYPE_CHECKING:",
    "pragma: no cover",
]
